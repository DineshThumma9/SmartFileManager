[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "smartfileman"
version = "0.1.0"
description = "A local-first, previewable smart file organizer and MCP server."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.13,<2",
  "numpy>=1.26,<3",
  "ollama>=0.5,<1",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
  "rich>=13,<15",
  "scikit-learn>=1.5,<2",
  "sqlmodel>=0.0.22,<1",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
smartfile = "smartfileman.cli:main"
smartfile-mcp = "smartfileman.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smartfileman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
